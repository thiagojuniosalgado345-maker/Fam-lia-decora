name: Publicar Família Decora no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check gestao.js
      - name: Validar estrutura, IDs e referências locais
        run: node scripts/validate-site.mjs
      - name: Preparar somente os arquivos públicos do site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html style.css app.js gestao.html gestao.css gestao.js .nojekyll _site/
          cp assets/logo-familia-decora.webp _site/assets/
          cp data/agenda.json _site/data/
      - name: Publicar artefato do site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
